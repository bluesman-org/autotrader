          format: "double"
        maximum:
          type: "number"
          format: "double"
        entryOperator:
          type: "string"
        entryConditions:
          type: "array"
          items:
            type: "string"
        exitOperator:
          type: "string"
        exitConditions:
          type: "array"
          items:
            type: "string"
        train:
