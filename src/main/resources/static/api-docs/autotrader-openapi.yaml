        id:
          type: "string"
        createdAt:
          type: "string"
          format: "date-time"
        updatedAt:
          type: "string"
          format: "date-time"
        runAt:
          type: "string"
          format: "date-time"
        market:
          type: "string"
        interval:
          type: "string"
        fromTime:
          type: "integer"
          format: "int64"
        toTime:
          type: "integer"
          format: "int64"
        candleCount:
          type: "integer"
          format: "int32"
        initialCapital:
          type: "number"
          format: "double"
        amountPerBuy:
          type: "number"
          format: "double"
        feeRate:
          type: "number"
          format: "double"
        warmUpCandles:
          type: "integer"
          format: "int32"
        trainRatio:
          type: "number"
          format: "double"
        rankingMetric:
          type: "string"
        combinationsEvaluated:
          type: "integer"
          format: "int32"
        entries:
          type: "array"
          items:
            $ref: "#/components/schemas/BacktestRunEntry"
    BacktestRunEntry:
