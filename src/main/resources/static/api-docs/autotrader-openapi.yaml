---
openapi: "3.1.0"
info:
  title: "AutoTrader API"
  description: "API for automating trading strategies"
  version: "1.0"
servers:
  - url: "http://localhost:8081/autotrader"
    description: "Generated server url"
tags:
  - name: "TradingView Webhook"
    description: "API for receiving and processing TradingView alerts"
  - name: "Backtests"
    description: "API for running strategy backtests over stored candles"
  - name: "Bot Configuration"
    description: "API for managing trading bot configurations"
  - name: "Transaction History"
    description: "API for viewing Bitvavo transaction history"
paths:
  /webhook/tradingview:
    post:
      tags:
        - "TradingView Webhook"
      summary: "Process TradingView alert"
      description: "Receives and processes alerts from TradingView to execute trading\
        \ actions. Validates the request based on IP address and API key before processing."
      operationId: "handleWebhook"
      parameters:
        - name: "X-API-KEY"
          in: "header"
          description: "API key for authentication"
          required: true
          allowEmptyValue: true
          schema:
            type: "string"
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TradingViewAlertRequest"
        required: true
      responses:
        "200":
          description: "Alert processed successfully"
          content:
            '*/*':
              schema:
                type: "object"
        "400":
          description: "Invalid request parameters or alert data"
          content:
            text/plain:
              schema:
                type: "string"
        "401":
          description: "Unauthorized - Either IP address not in allowed list or invalid\
            \ API key"
          content:
            text/plain:
              schema:
                type: "string"
        "500":
          description: "Server error processing the alert"
          content:
            text/plain:
              schema:
                type: "string"
  /api/bots/webhook-key/{botId}:
    post:
      tags:
        - "Bot Configuration"
      summary: "Generate a new webhook API key"
      description: "Generates a new webhook API key for a specific bot configuration"
      operationId: "generateWebhookApiKey"
      parameters:
        - name: "botId"
          in: "path"
          description: "ID of the bot configuration to generate a webhook API key\
            \ for"
          required: true
          schema:
            type: "string"
      responses:
        "200":
          description: "Webhook API key generated successfully"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WebhookApiKeyResponse"
        "404":
          description: "Bot configuration not found within active configurations"
  /api/bots/create:
    post:
      tags:
        - "Bot Configuration"
      summary: "Create a new bot configuration"
      description: "Creates a new trading bot configuration with the provided details"
      operationId: "createBotConfiguration"
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BotConfigurationRequest"
        required: true
      responses:
        "201":
          description: "Bot configuration created successfully"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BotConfigurationResponse"
  /api/backtests:
    get:
      tags:
        - "Backtests"
      summary: "List recent backtest runs"
      description: "Returns the most recent runs, newest first. Stored entries are\
        \ omitted from the list."
      operationId: "recent"
      parameters:
        - name: "limit"
          in: "query"
          description: "Maximum number of runs to return (1-100)"
          required: false
          schema:
            type: "integer"
            format: "int32"
            default: 20
      responses:
        "200":
          description: "Runs returned"
          content:
            application/json: {}
        "400":
          description: "limit is out of range"
    post:
      tags:
        - "Backtests"
      summary: "Run a backtest sweep"
      description: "Fetches the requested candles, sweeps the entry×exit rule matrices\
        \ and the indicator parameter grids (at most 5000 combinations), optimises\
        \ on the earlier part of the range and verifies on the held-out newer part,\
        \ then stores the top ranked entries. Fields left out fall back to their defaults\
        \ (1000 EUR capital, 100 EUR per buy, 0.20% fee per side, 200-candle warm-up,\
        \ 0.7 split, TOTAL_RETURN ranking, 12/26/9 MACD, 0.02/0.2 SAR, a MACD bullish\
        \ crossover entry and a bearish SAR crossover exit)."
      operationId: "run"
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BacktestRunRequest"
        required: true
      responses:
        "201":
          description: "Backtest run completed and stored"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BacktestRun"
        "400":
          description: "Invalid request, no candles for the range, or more than 5000\
            \ combinations"
  /api/bots/deactivate/{botId}:
    patch:
      tags:
        - "Bot Configuration"
      summary: "Deactivate a bot configuration"
      description: "Deactivates a specific bot configuration so it no longer processes\
        \ trades"
      operationId: "deactivateBotConfiguration"
      parameters:
        - name: "botId"
          in: "path"
          description: "ID of the bot configuration to deactivate"
          required: true
          schema:
            type: "string"
      responses:
        "200":
          description: "Bot configuration deactivated successfully"
          content:
            text/plain:
              schema:
                type: "string"
        "404":
          description: "Bot configuration not found within active configurations"
  /api/bots/activate/{botId}:
    patch:
      tags:
        - "Bot Configuration"
      summary: "Activate a bot configuration"
      description: "Activates a specific bot configuration so it can process trades"
      operationId: "activateBotConfiguration"
      parameters:
        - name: "botId"
          in: "path"
          description: "ID of the bot configuration to activate"
          required: true
          schema:
            type: "string"
      responses:
        "200":
          description: "Bot configuration activated successfully"
          content:
            text/plain:
              schema:
                type: "string"
        "404":
          description: "Bot configuration not found within active configurations"
  /api/bots:
    get:
      tags:
        - "Bot Configuration"
      summary: "Get all bot configurations"
      description: "Retrieves a list of all bot configurations, optionally including\
        \ inactive ones"
      operationId: "getAllBotConfigurations"
      parameters:
        - name: "includeInactive"
          in: "query"
          description: "Whether to include inactive bot configurations"
          required: false
          schema:
            type: "boolean"
            default: false
      responses:
        "200":
          description: "Bot configurations retrieved successfully"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BotConfigurationResponse"
  /api/bots/{botId}:
    get:
      tags:
        - "Bot Configuration"
      summary: "Get a bot configuration by ID"
      description: "Retrieves the details of a specific bot configuration"
      operationId: "getBotConfiguration"
      parameters:
        - name: "botId"
          in: "path"
          description: "ID of the bot configuration to retrieve"
          required: true
          schema:
            type: "string"
      responses:
        "200":
          description: "Bot configuration retrieved successfully"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BotConfigurationResponse"
        "400":
          description: "Invalid bot ID format"
        "404":
          description: "Bot configuration not found within active configurations"
  /api/bots/{botId}/transactions:
    get:
      tags:
        - "Transaction History"
      summary: "Get transaction history for a bot"
      description: "Returns the Bitvavo transaction history for the account of the\
        \ specified bot. The history is account-wide; the bot only provides the API\
        \ credentials used for the request. Results can be filtered by date range\
        \ and transaction type, and are paginated."
      operationId: "getTransactions"
      parameters:
        - name: "botId"
          in: "path"
          description: "ID of the bot whose credentials are used"
          required: true
          schema:
            type: "string"
        - name: "fromDate"
          in: "query"
          description: "Unix timestamp in milliseconds to return transactions from"
          required: false
          schema:
            type: "integer"
            format: "int64"
        - name: "toDate"
          in: "query"
          description: "Unix timestamp in milliseconds to return transactions up to"
          required: false
          schema:
            type: "integer"
            format: "int64"
        - name: "page"
          in: "query"
          description: "Page number to return"
          required: false
          schema:
            type: "integer"
            format: "int32"
        - name: "maxItems"
          in: "query"
          description: "Maximum number of items per page (1-100)"
          required: false
          schema:
            type: "integer"
            format: "int32"
        - name: "type"
          in: "query"
          description: "Transaction type to filter by (e.g. buy, sell, deposit, withdrawal)"
          required: false
          schema:
            type: "string"
      responses:
        "200":
          description: "Transaction history retrieved successfully"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GetAccountHistoryResponse"
        "400":
          description: "Invalid bot ID or request parameters"
        "404":
          description: "Bot configuration not found within active configurations"
  /api/backtests/{id}:
    get:
      tags:
        - "Backtests"
      summary: "Get a backtest run"
      description: "Returns a stored backtest run and its ranked entries."
      operationId: "get"
      parameters:
        - name: "id"
          in: "path"
          description: "ID of the backtest run"
          required: true
          schema:
            type: "string"
      responses:
        "200":
          description: "Run found"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BacktestRun"
        "404":
          description: "No run with that ID"
components:
  schemas:
    TradingViewAlertRequest:
      type: "object"
      description: "Alert details from TradingView"
      properties:
        botId:
          type: "string"
        ticker:
          type: "string"
        action:
          type: "string"
        timestamp:
          type: "string"
        dryRun:
          type: "boolean"
    WebhookApiKeyResponse:
      type: "object"
      properties:
        apiKey:
          type: "string"
    BotConfigurationRequest:
      type: "object"
      description: "Bot configuration details"
      properties:
        apiKey:
          type: "string"
        apiSecret:
          type: "string"
        tradingPair:
          type: "string"
        operatorId:
          type: "integer"
          format: "int64"
    BotConfigurationResponse:
      type: "object"
      properties:
        botId:
          type: "string"
        tradingPair:
          type: "string"
        active:
          type: "boolean"
        operatorId:
          type: "integer"
          format: "int64"
    BacktestRunRequest:
      type: "object"
      properties:
        market:
          type: "string"
          description: "Market in Bitvavo format"
          example: "BTC-EUR"
        interval:
          type: "string"
          description: "Candlestick interval code"
          example: "1h"
        fromDate:
          type: "integer"
          format: "int64"
          description: "Range start, epoch milliseconds"
          example: 1783069200000
        toDate:
          type: "integer"
          format: "int64"
          description: "Range end, epoch milliseconds"
          example: 1791705600000
        initialCapital:
          type: "number"
          format: "double"
          description: "Starting cash in EUR"
          example: 1000
        amountPerBuy:
          type: "number"
          format: "double"
          description: "Fixed EUR amount per buy, before fees"
          example: 100
        feeRate:
          type: "number"
          format: "double"
          description: "Fee per side as a fraction; defaults to the account's taker\
            \ rate"
          example: 0.002
        warmUpCandles:
          type: "integer"
          format: "int32"
          description: "Leading candles that are never traded"
          example: 200
        trainRatio:
          type: "number"
          format: "double"
          description: "Share of the range the sweep optimises on"
          example: 0.7
        rankingMetric:
          type: "string"
          description: "Metric to rank by"
          enum:
            - "TOTAL_RETURN"
            - "PROFIT_FACTOR"
            - "MAX_DRAWDOWN"
            - "WIN_RATE"
          example: "TOTAL_RETURN"
        macdParameters:
          type: "array"
          description: "MACD parameter candidates; defaults to 12/26/9"
          items:
            $ref: "#/components/schemas/MacdParametersRequest"
        sarParameters:
          type: "array"
          description: "Parabolic SAR parameter candidates; defaults to 0.02/0.2"
          items:
            $ref: "#/components/schemas/SarParametersRequest"
        entryRules:
          type: "array"
          description: "Entry rule sets to sweep; defaults to a MACD bullish crossover"
          items:
            $ref: "#/components/schemas/RuleSetRequest"
        exitRules:
          type: "array"
          description: "Exit rule sets to sweep; defaults to a bearish SAR crossover"
          items:
            $ref: "#/components/schemas/RuleSetRequest"
    MacdParametersRequest:
      type: "object"
      properties:
        fastPeriod:
          type: "integer"
          format: "int32"
          description: "Fast EMA period"
          example: 12
        slowPeriod:
          type: "integer"
          format: "int32"
          description: "Slow EMA period"
          example: 26
        signalPeriod:
          type: "integer"
          format: "int32"
          description: "Signal EMA period"
          example: 9
    RuleSetRequest:
      type: "object"
      properties:
        operator:
          type: "string"
          description: "How the conditions combine"
          enum:
            - "ALL"
            - "ANY"
          example: "ALL"
        conditions:
          type: "array"
          description: "The conditions"
          example:
            - "MACD_BULLISH_CROSSOVER"
          items:
            type: "string"
            enum:
              - "MACD_BULLISH_CROSSOVER"
              - "MACD_BEARISH_CROSSOVER"
              - "MACD_ABOVE_SIGNAL"
              - "MACD_BELOW_SIGNAL"
              - "HISTOGRAM_POSITIVE"
              - "HISTOGRAM_NEGATIVE"
              - "PRICE_ABOVE_SAR"
              - "PRICE_BELOW_SAR"
              - "SAR_BULLISH_CROSSOVER"
              - "SAR_BEARISH_CROSSOVER"
    SarParametersRequest:
      type: "object"
      properties:
        acceleration:
          type: "number"
          format: "double"
          description: "Acceleration factor"
          example: 0.02
        maximum:
          type: "number"
          format: "double"
          description: "Maximum acceleration factor"
          example: 0.2
    BacktestRun:
      type: "object"
      properties:
        id:
          type: "string"
        createdAt:
          type: "string"
          format: "date-time"
        updatedAt:
          type: "string"
          format: "date-time"
        runAt:
          type: "string"
          format: "date-time"
        market:
          type: "string"
        interval:
          type: "string"
        fromTime:
          type: "integer"
          format: "int64"
        toTime:
          type: "integer"
          format: "int64"
        candleCount:
          type: "integer"
          format: "int32"
        initialCapital:
          type: "number"
          format: "double"
        amountPerBuy:
          type: "number"
          format: "double"
        feeRate:
          type: "number"
          format: "double"
        warmUpCandles:
          type: "integer"
          format: "int32"
        trainRatio:
          type: "number"
          format: "double"
        rankingMetric:
          type: "string"
        combinationsEvaluated:
          type: "integer"
          format: "int32"
        entries:
          type: "array"
          items:
            $ref: "#/components/schemas/BacktestRunEntry"
    BacktestRunEntry:
      type: "object"
      properties:
        fastPeriod:
          type: "integer"
          format: "int32"
        slowPeriod:
          type: "integer"
          format: "int32"
        signalPeriod:
          type: "integer"
          format: "int32"
        acceleration:
          type: "number"
          format: "double"
        maximum:
          type: "number"
          format: "double"
        entryOperator:
          type: "string"
        entryConditions:
          type: "array"
          items:
            type: "string"
        exitOperator:
          type: "string"
        exitConditions:
          type: "array"
          items:
            type: "string"
        train:
          $ref: "#/components/schemas/BacktestRunMetrics"
        validate:
          $ref: "#/components/schemas/BacktestRunMetrics"
    BacktestRunMetrics:
      type: "object"
      properties:
        finalEquity:
          type: "number"
          format: "double"
        totalReturnPercent:
          type: "number"
          format: "double"
        maxDrawdownPercent:
          type: "number"
          format: "double"
        tradeCount:
          type: "integer"
          format: "int32"
        winRatePercent:
          type: "number"
          format: "double"
        profitFactor:
          type: "number"
          format: "double"
    GetAccountHistoryResponse:
      type: "object"
      properties:
        items:
          type: "array"
          items:
            $ref: "#/components/schemas/Transaction"
        currentPage:
          type: "integer"
          format: "int32"
        totalPages:
          type: "integer"
          format: "int32"
        maxItems:
          type: "integer"
          format: "int32"
    Transaction:
      type: "object"
      properties:
        transactionId:
          type: "string"
        executedAt:
          type: "string"
          format: "date-time"
        type:
          type: "string"
        priceCurrency:
          type: "string"
        priceAmount:
          type: "number"
        sentCurrency:
          type: "string"
        sentAmount:
          type: "number"
        receivedCurrency:
          type: "string"
        receivedAmount:
          type: "number"
        feesCurrency:
          type: "string"
        feesAmount:
          type: "number"
        address:
          type: "string"
