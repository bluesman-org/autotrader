# WARNING: SET UP YOUR ENVIRONMENT VARIABLES BEFORE RUNNING THE APPLICATION
# EXAMPLE: export MONGODB_AUTOTRADER_USER=your_user
server:
  port: 8081
  servlet:
    context-path: /autotrader
    session:
      cookie:
        # The production deployment answers on https://at.bluris.nl behind Caddy, where the session
        # cookie must be secure; a local http run sets SESSION_COOKIE_SECURE=false (the default) or
        # the browser would never send the cookie back.
        secure: ${SESSION_COOKIE_SECURE:false}
        # The API takes this cookie too and turns CSRF off for it, so the cookie states its own
        # cross-site rule rather than leaning on the browser default. Strict is safe here: the
        # recovery mail links to an open page, and signing in is a same-site form post.
        same-site: strict
  # Caddy terminates TLS and forwards the original scheme, so redirects and cookies keep https.
  # `native` rather than `framework`: Tomcat rewrites the client address only when the peer is a
  # trusted proxy on this host and ignores the `Forwarded` header, so the loopback rule that admits
  # the specification exporter cannot be spoofed by a header.
  forward-headers-strategy: native

spring:
  application:
    name: autotrader
  # The pages stay dot-decimal like the API, the docs and the numeric form fields, whatever
  # locale a browser sends.
  web:
    locale: en_US
    locale-resolver: fixed
  data:
    mongodb:
      uri: mongodb+srv://${MONGODB_AUTOTRADER_USER}:${MONGODB_AUTOTRADER_PASSWORD}@${MONGODB_AUTOTRADER_URI}
      database: autotrader

management:
  endpoints:
    web:
      exposure:
        include: health, info, env, loggers
  endpoint:
    health:
      show-details: always
#    env:
#      show-values: always

bitvavo:
  api:
    url: ${BITVAVO_API_URL}

# Encryption settings for sensitive data
encryption:
  master-key: ${ENCRYPTION_MASTER_KEY}  # Base64 encoded key, should be set via environment variable in production

# The account, the recovery mails and the address the links in them point at.
autotrader:
  security:
    public-url: ${AUTOTRADER_PUBLIC_URL:http://localhost:8081/autotrader}
    reset-token-minutes: 30

# Live engine: the WebSocket endpoint and our keepalive/reconnect policy.
strategy:
  live:
    websocket-url: wss://ws.bitvavo.com/v2/
    keepalive-seconds: 30
    reconnect-delay-millis: 5000

# TLS for the MongoDB client built in MongoConfig (default: true).
# Set to false to connect to a local server without TLS. Note that Spring Boot's
# spring.data.mongodb.ssl.enabled has no effect because this application builds its own client.
# mongodb:
#   ssl:
#     enabled: true
