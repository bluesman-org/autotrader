<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot your password · Autotrader</title>
    <link rel="icon"
          href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>📈</text></svg>">
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body>
<nav th:replace="~{fragments/nav :: nav}"></nav>
<main class="container" style="max-width:520px">
    <h1>Forgot your password</h1>
    <div class="card" style="padding:18px 22px">
        <div class="banner" th:if="${message}" th:text="${message}">We'll send a recovery email.</div>
        <p class="muted">The account's email address receives a link that sets a new password. The
            link works once and expires after half an hour.</p>
        <form method="post" th:action="@{/forgot-password}">
            <div class="filters">
                <div class="f">
                    <label>Email</label>
                    <input type="email" name="email" th:value="${email}" autocomplete="email" required
                           autofocus style="width:280px">
                </div>
                <div>
                    <button class="primary small" type="submit">Send the link</button>
                </div>
            </div>
        </form>
        <p class="muted" style="margin:14px 0 0"><a th:href="@{/login}">Back to sign in</a></p>
    </div>
</main>
</body>
</html>
