<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Set a new password · Autotrader</title>
    <link rel="icon"
          href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>📈</text></svg>">
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body>
<nav th:replace="~{fragments/nav :: nav}"></nav>
<main class="container" style="max-width:520px">
    <h1>Set a new password</h1>

    <div class="card" style="padding:18px 22px" th:unless="${valid}">
        <p>This recovery link is no longer valid — it may have expired, or a newer link may have
            replaced it.</p>
        <p><a th:href="@{/forgot-password}">Ask for a new link</a></p>
    </div>

    <div class="card" style="padding:18px 22px" th:if="${valid}">
        <div class="banner error" th:if="${error}" th:text="${error}">error</div>
        <p class="muted">Choose a password of at least 10 characters. The link stops working once
            it is set.</p>
        <form method="post" th:action="@{/reset-password}" autocomplete="off">
            <input type="hidden" name="token" th:value="${token}">
            <div class="filters">
                <div class="f">
                    <label>New password</label>
                    <input type="password" name="password" autocomplete="new-password" required
                           autofocus style="width:240px">
                </div>
                <div class="f">
                    <label>New password again</label>
                    <input type="password" name="confirm" autocomplete="new-password" required
                           style="width:240px">
                </div>
                <div>
                    <button class="primary small" type="submit">Set the password</button>
                </div>
            </div>
        </form>
    </div>
</main>
</body>
</html>
