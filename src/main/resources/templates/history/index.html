<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Account history · Autotrader</title>
    <link rel="icon"
          href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>📈</text></svg>">
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body>
<nav th:replace="~{fragments/nav :: nav}"></nav>
<main class="container">
    <h1>Account history</h1>
    <p class="muted" th:text="|Times are local time (${timeZoneLabel}). Click a column header to sort; click it again to flip the direction.|">
        Times are local time (CEST). Click a column header to sort; click it again to flip the
        direction.
    </p>

    <div class="tabs">
        <a class="active" th:href="@{/ui/history}">Engine trades</a>
    </div>

    <form id="history-filters" class="card" style="padding:16px 20px" method="get"
          th:action="@{/ui/history}">
        <div class="filters">
            <div class="f"><label>Strategy</label>
                <select name="strategy">
                    <option value="">All strategies</option>
                    <option th:each="option : ${history.filters.strategyOptions}" th:value="${option.value}"
                            th:text="${option.label}"
                            th:selected="${option.value == history.filters.strategy}">6ace5dbf</option>
                </select>
            </div>
            <div class="f"><label>Type</label>
                <select name="type">
                    <option value="">All types</option>
                    <option value="dry" th:selected="${history.filters.type == 'dry'}">Dry-run</option>
                    <option value="real" th:selected="${history.filters.type == 'real'}">Real</option>
                </select>
            </div>
            <div class="f"><label>Result</label>
                <select name="result">
                    <option value="">All results</option>
                    <option value="wins" th:selected="${history.filters.result == 'wins'}">Wins</option>
                    <option value="losses" th:selected="${history.filters.result == 'losses'}">Losses</option>
                </select>
            </div>
            <div class="f"><label>Time</label>
                <select name="period">
                    <option th:each="option : ${history.filters.timeOptions}" th:value="${option.value}"
                            th:text="${option.label}"
                            th:selected="${option.value == history.filters.period}">Last 7 days</option>
                </select>
            </div>
            <div class="f" style="min-width:250px"><label>Custom range — from</label>
                <div style="display:flex;gap:6px;align-items:center">
                    <input type="date" name="fromDate" th:value="${history.filters.fromDate}"
                           style="width:150px">
                    <input type="text" name="fromTime" th:value="${history.filters.fromTime}"
                           placeholder="HH:MM" style="width:64px">
                </div>
            </div>
            <div class="f" style="min-width:250px"><label>to</label>
                <div style="display:flex;gap:6px;align-items:center">
                    <input type="date" name="toDate" th:value="${history.filters.toDate}"
                           style="width:150px">
                    <input type="text" name="toTime" th:value="${history.filters.toTime}"
                           placeholder="HH:MM" style="width:64px">
                </div>
            </div>
            <div>
                <button class="primary small" type="submit">Apply</button>
            </div>
        </div>
    </form>

    <div id="history-content" th:insert="~{history/trades :: trades}"></div>
</main>

<script>
    // Sorting, paging and applying filters swap the table in place: no scroll jump, and the address
    // bar keeps the whole state, so a reload or a shared URL shows the same view. A failed fetch
    // keeps the last state on screen.
    (function () {
        var content = document.getElementById('history-content');
        var form = document.getElementById('history-filters');
        if (!content || !form) {
            return;
        }

        function swap(url) {
            fetch(url + (url.indexOf('?') === -1 ? '?' : '&') + 'fragment=1',
                    { headers: { 'X-Requested-With': 'fetch' } })
                .then(function (response) { return response.ok ? response.text() : null; })
                .then(function (html) {
                    if (html === null) {
                        return;
                    }
                    content.innerHTML = html;
                    window.history.replaceState(null, '', url);
                })
                .catch(function () { /* keep the last state */ });
        }

        content.addEventListener('click', function (event) {
            var link = event.target.closest('a');
            if (!link) {
                return;
            }
            event.preventDefault();
            swap(link.getAttribute('href'));
        });

        content.addEventListener('change', function (event) {
            if (event.target.matches('select[data-history-size]')) {
                swap(event.target.value);
            }
        });

        form.addEventListener('submit', function (event) {
            event.preventDefault();
            var params = [];
            new FormData(form).forEach(function (value, key) {
                if (String(value).trim() !== '') {
                    params.push(encodeURIComponent(key) + '=' + encodeURIComponent(value));
                }
            });
            swap(form.getAttribute('action') + '?' + params.join('&'));
        });
    })();
</script>
</body>
</html>
