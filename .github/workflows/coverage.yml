name: Coverage

on:
  pull_request:
  push:
    branches: [main]
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - 'wiki/**'
      - 'improvement-plans/**'
      - 'logs/**'
      - '.idea/**'
      - '.vscode/**'

jobs:
  coverage:
    runs-on: ubuntu-latest
    services:
      # The repository queries execute against a real server: a document Mongo accepts can still
      # name the wrong field or carry the wrong bound, and only execution shows it. The suite is
      # skipped without MONGODB_TEST_URI, so this service is what makes it run in CI.
      mongo:
        image: mongo:8.0
        ports:
          - 27017:27017
    steps:
      - uses: actions/checkout@v7
      - name: Wait for the Mongo service
        # The service container reports "healthy" without a health check, so this waits for mongod
        # itself and dumps the container's state and log when it never comes up.
        run: |
          container=$(docker ps --all --quiet --filter "name=mongo" | head -1)
          for attempt in $(seq 1 30); do
            if docker exec "$container" mongosh --quiet --eval 'db.runCommand({ ping: 1 }).ok' >/dev/null 2>&1; then
              echo "mongod answers inside the container"
              docker port "$container"
              if timeout 2 bash -c 'cat < /dev/null > /dev/tcp/127.0.0.1/27017' 2>/dev/null; then
                echo "the published port answers on the host"
              else
                echo "the published port does not answer on the host"
              fi
              exit 0
            fi
            sleep 1
          done
          echo "mongod did not answer inside the container"
          docker ps --all
          docker logs "$container"
          exit 1
      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'maven'
      - name: Run tests and enforce coverage thresholds
        env:
          # A database ending in _test is required: the suite drops it before every test.
          MONGODB_TEST_URI: mongodb://127.0.0.1:27017/autotrader_query_test
        run: ./mvnw -B verify -Ddocker.skip=true
