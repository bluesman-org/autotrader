version: 2

# Twice a month rather than weekly: 03:00 UTC on the 1st and 15th, at most two open PRs per
# ecosystem so the review queue stays short.
updates:
  - package-ecosystem: "maven"
    directory: "/"
    schedule:
      interval: "cron"
      cronjob: "0 3 1,15 * *"
    open-pull-requests-limit: 2
    ignore:
      # Spring Boot only moves with the JDK, springdoc and a compile pass (issue #18, PLAN item 11).
      # A bare major bump fails to build (Security 7 removed AntPathRequestMatcher, Boot 4 moved
      # WebServerInitializedEvent), so Dependabot would keep reopening a PR that cannot merge.
      # Lift this entry when the migration lands (issue #18, PLAN item 11).
      - dependency-name: "org.springframework.boot:spring-boot-starter-parent"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "cron"
      cronjob: "0 3 1,15 * *"
    open-pull-requests-limit: 2

  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "cron"
      cronjob: "0 3 1,15 * *"
    open-pull-requests-limit: 2
    ignore:
      # The JDK only moves with a Spring Boot upgrade that supports it (issue #18). The whole
      # image is ignored rather than majors only: update-types filtering is unreliable for
      # Docker (dependabot-core#12112), and every suggestion for this tag was a major jump.
      - dependency-name: "eclipse-temurin"
